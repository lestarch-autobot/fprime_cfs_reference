# Builds the F Prime CFS reference (native simulation), the COSMOS plugin, and runs the GDS integration tests

name: "Build and Test"

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build and Integration Tests"
    runs-on: ubuntu-22.04
    env:
      # openc3inc/openc3-cosmos-cmd-tlm-api:7.5.1, pinned by digest (renders the plugin in the load test, builds the gem
      # in the docker builder check)
      OPENC3_IMAGE: openc3inc/openc3-cosmos-cmd-tlm-api@sha256:7b259b14533a94e786899deccaeaa477f1d60aaed07c8a25e907f9232384f14c
    steps:
      - name: "Make Space"
        uses: nasa/fprime-actions/make-space@devel
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Setup F´ environment"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ./libs/fprime
      - name: "Install fprime_cfs GDS plugins"
        run: pip3 install -r requirements.txt
      - name: "Build"
        run: |
          make SIMULATION=native prep
          make
          make install
      - name: "Run Integration Tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          gds-working-directory: build-artifacts/exe/cpu1
          test-working-directory: test/int
          binary: ./core-cpu1
          binary-args: ""
          gds-args: >-
            --communication-selection cfs-lab --framing-selection cfs
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
          pytest-args: >-
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
            --deployment-config ${{ github.workspace }}/test/int/int_config.json
      - name: "Archive logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfs-reference-logs
          path: build-artifacts/exe/cpu1/gds-logs
          retention-days: 5
      - name: "Build COSMOS plugin"
        run: make cosmos_plugin
      - name: "Load test COSMOS plugin"
        run: >-
          libs/fprime_cfs_cosmos/tests/cosmos/run.sh
          build-artifacts/native/default_cpu1/cosmos/bundles/FPRIME_APP FPRIME_APP
          --nasa build-artifacts/native/default_cpu1/cosmos/cfs-cosmos-plugin
          --image "$OPENC3_IMAGE"
      - name: "Build and check the gem with the docker builder"
        run: |
          COSMOS_GEM_BUILDER=docker COSMOS_IMAGE="$OPENC3_IMAGE" cosmos/build-plugin.sh \
            build-artifacts/native/default_cpu1/cosmos/cfs-cosmos-plugin 0.0.0.pre.docker \
            build-artifacts/native/default_cpu1/cosmos/docker-builder
          cosmos/check-plugin.sh build-artifacts/native/default_cpu1/cosmos/cfs-cosmos-plugin \
            build-artifacts/native/default_cpu1/cosmos/docker-builder/openc3-cosmos-cfs-0.0.0.pre.docker.gem 1 \
            build-artifacts/native/default_cpu1/cosmos/bundles/FPRIME_APP
      - name: "Start COSMOS 7.5.1 (cosmos-project) with the cFS reference plugin"
        # Deployment -> COSMOS -> Integration Test API: COSMOS owns the cFS link (to_lab UDP 2234 into the plugin's
        # CFS-1 interface), the test API talks only to COSMOS through the fprime-cosmos `cosmos` data transport.
        run: |
          git clone --depth 1 --branch v7.5.1 https://github.com/OpenC3/cosmos-project.git cosmos-project
          cp cosmos/compose.override.yaml cosmos-project/
          cd cosmos-project
          ./openc3.sh run
          # ready = the init container (buckets, default plugins) has exited 0 and the API answers; loading a
          # plugin earlier fails with "Bucket 'config' does not exist"
          init=$(docker compose -f compose.yaml -f compose.override.yaml ps -a -q openc3-cosmos-init)
          test "$(timeout 600 docker wait "$init")" = "0" || { docker logs "$init" | tail -50; exit 1; }
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2900/openc3-api/api || true)
            [ "$code" = "404" ] || [ "$code" = "405" ] && break
            sleep 5
          done
          mkdir -p cfs-plugin
          cp ../build-artifacts/native/default_cpu1/cosmos/openc3-cosmos-cfs-*.gem cfs-plugin/
          # vars.json's cfs_1_intf_ip is the compose network gateway (COSMOS -> ci_lab on the runner host)
          gateway=$(docker network inspect cosmos-project_default -f '{{(index .IPAM.Config 0).Gateway}}')
          python3 -c "import json,sys; v=json.load(open('../cosmos/vars.json')); v['cfs_1_intf_ip']='$gateway'; json.dump(v, open('cfs-plugin/vars.json','w'))"
          set -a; . ./.env; set +a
          # openc3.sh cli needs a TTY; this is its command without -t (service password = API password here)
          docker compose -f compose.yaml -f compose.override.yaml run --rm -T -v "$PWD:/openc3/local:z" -w /openc3/local \
            -e OPENC3_API_PASSWORD="$OPENC3_SERVICE_PASSWORD" --no-deps openc3-cosmos-cmd-tlm-api \
            ruby /openc3/bin/openc3cli load cfs-plugin/openc3-cosmos-cfs-*.gem --variables cfs-plugin/vars.json
      - name: "Integration tests through COSMOS (fprime-gds data-transport plugin `cosmos`, cfs layout)"
        # fprime-gds with the data-transport plugin category (nasa/fprime-gds#386) and the fprime-cosmos transport
        # (fprime-community/fprime-cosmos#3 + #4) until both are released; then plain `pip install fprime-cosmos`.
        run: |
          python3 -m venv cosmos-venv
          # the fork clone carries no tags, so setuptools-scm would version fprime-gds 0.1.devN and fail
          # fprime-cosmos's fprime-gds>=4.4.0a4 pin; pretend the version the branch is based on
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FPRIME_GDS=4.4.2.dev17 \
          cosmos-venv/bin/pip install -q "fprime-gds @ git+https://github.com/lestarch-autobot/fprime-gds.git@devin/1794262255-data-transport-plugin" \
            "fprime-cosmos @ git+https://github.com/lestarch-autobot/fprime-cosmos.git@devin/1794290000-cosmos-events" pytest
          set -a; . cosmos-project/.env; set +a
          export OPENC3_API_PASSWORD="$OPENC3_SERVICE_PASSWORD"
          (cd build-artifacts/exe/cpu1 && ./core-cpu1 > core-cpu1.log 2>&1 &) ; sleep 10
          rpc() { curl -sf -X POST http://localhost:2900/openc3-api/api -H "Authorization: $OPENC3_API_PASSWORD" \
                   -H 'Content-Type: application/json-rpc' -d "$1"; }
          rpc '{"jsonrpc":"2.0","id":1,"method":"cmd_no_hazardous_check","params":["CFS-1","TO_LAB_CMD_ENABLE_OUTPUT",{"DEST_IP":"127.0.0.1"}],"keyword_params":{"scope":"DEFAULT"}}'
          sleep 5
          cosmos-venv/bin/python -m pytest -v test/int \
            --dictionary "${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json" \
            --deployment-config "${{ github.workspace }}/test/int/int_config.json" \
            --data-transport-selection cosmos --cosmos-url http://localhost:2900 --cosmos-target FPRIME_APP --cosmos-layout cfs
      - name: "Stop COSMOS"
        if: always()
        run: |
          pkill -f core-cpu1 || true
          (cd cosmos-project && ./openc3.sh stop) || true
      - name: "Collect COSMOS plugin artifact"
        run: cp cosmos/vars.json cosmos/compose.override.yaml build-artifacts/native/default_cpu1/cosmos/
      - name: "Archive COSMOS plugin"
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-plugin
          path: |
            build-artifacts/native/default_cpu1/cosmos/openc3-cosmos-cfs-*.gem
            build-artifacts/native/default_cpu1/cosmos/vars.json
            build-artifacts/native/default_cpu1/cosmos/compose.override.yaml
          if-no-files-found: error
